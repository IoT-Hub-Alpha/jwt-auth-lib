[tool.black]
line-length = 88
target-version = ["py311"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-auth"
version = "0.1.0"
description = "Shared JWT authentication library for Django and FastAPI microservices"
readme = "readme.md"
requires-python = ">=3.10"
authors = [
  { name = "Iot Team Alpha" }
]
dependencies = [
    "PyJWT>=2.0",
]

[project.optional-dependencies]
django = ["django>=4.0"]
fastapi = ["fastapi>=0.100", "starlette>=0.27"]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iot_auth = ["py.typed"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
asyncio_mode = "auto"
